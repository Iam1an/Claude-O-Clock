[package]
name = "claudeoclock"
version = "0.1.0"
edition = "2021"

[lib]
name = "claudeoclock_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "claudeoclock"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }

# tray-icon: macOS uses a menu-bar tray app. Linux/Hyprland uses a plain
# always-on-top window (Close collapses it to its titlebar rather than hiding).
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
